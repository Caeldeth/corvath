name: Release

# Builds and publishes a tagged release. The PR gate lives in ci.yml — do NOT
# add a `pull_request` trigger here: this workflow builds and signs three
# platforms and no PR needs that. (It used to carry the gate, which is why the
# validate job below is now only a pre-release sanity check rather than the
# only thing standing between a PR and main.)
#
# Optional repository secrets — every one of them is guarded, so a release
# without them still produces usable, unsigned artifacts:
#   ES_USERNAME / ES_PASSWORD / ES_CREDENTIAL_ID / ES_TOTP_SECRET  (SSL.com eSigner, Windows)
#     — when unset, the exe ships UNSIGNED and SmartScreen warns on first run.
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID          (notarization, macOS)
#   CSC_LINK / CSC_KEY_PASSWORD                                     (Developer ID cert, macOS)
#     — when unset, the dmg is unsigned and Gatekeeper warns. Flip
#       `mac.notarize` to true in electron-builder.yml once these exist.
#   DISCORD_WEBHOOK_URL                                             (release announcement)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Kept for sslcom/esigner-codesign@v1.3.2, which still declares `using: node20`.
  # Every actions/* pin below is Node 24 native, so this env exists for that one
  # action alone — do not delete it as boilerplate while that pin remains.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Fast sanity gate before three platform builds start. ci.yml is the real gate
  # on the way into main; this catches a tag cut from a broken commit.
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Test + coverage gate
        run: npm run test:coverage

  build-windows:
    runs-on: windows-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package portable exe
        run: npx electron-builder --win --publish never

      - name: Resolve artifact name + version
        id: pkg
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The secrets context isn't available in a step-level `if:`, so probe it
      # into an output first and gate the signing step on that.
      - name: Check for signing credentials
        id: signing
        shell: bash
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
        run: |
          if [ -n "$ES_USERNAME" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No SSL.com eSigner credentials set — shipping an UNSIGNED exe.'
          fi

      - name: Sign portable exe (SSL.com eSigner)
        if: steps.signing.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist/${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}-portable.exe
          override: true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: dist/*-portable.exe
          if-no-files-found: error
          # 1 day, not the 90-day default. These exist only to hand packages to
          # the `release` job minutes later; the published Release keeps its own
          # copy and release assets do not count against Actions storage. Three
          # 90-day releases were enough to exhaust the quota on a sibling, which
          # then failed every build job and published nothing.
          retention-days: 1

  build-mac:
    runs-on: macos-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # Same probe-into-an-output trick as the Windows signing step above: the
      # secrets context is not usable in a step-level `if:`.
      - name: Check for signing credentials
        id: signing
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No Developer ID certificate set — shipping an UNSIGNED dmg.'
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}

      # A universal dmg (x64 + arm64 in one). electron-builder signs when
      # CSC_LINK is present and notarizes when mac.notarize is true and the
      # APPLE_* vars are set; with neither it produces an unsigned dmg instead
      # of failing, which is what we want until the certificates exist.
      - name: Package dmg
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package AppImage + deb
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac, build-linux]
    if: github.ref_type == 'tag'

    steps:
      # Checkout (the release job otherwise only downloads artifacts) so the
      # CHANGELOG + extract script are on disk.
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Pull this tag's section from CHANGELOG.md into the release body. Missing
      # section → empty file → the release falls back to the auto notes below.
      - name: Extract release notes from CHANGELOG
        run: node scripts/changelog-extract.mjs "${{ github.ref_name }}" > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*-portable.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          # Curated CHANGELOG section on top; generate_release_notes appends the
          # auto PR list + Full Changelog link below it.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Notify Discord
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && { echo "No webhook configured; skipping."; exit 0; }
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"**Corvath $TAG** is now available!\n$RELEASE_URL\"}" \
            "$DISCORD_WEBHOOK_URL"
